<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Rob Barrett</td>
            <td>He Will Make More of You</td>
            <td>BYUI</td>
            <td>September 29, 2026</td>
          </tr>
          <tr>
            <td>President Alvin F. Meredith III</td>
            <td>The Mission of BYU-Idaho</td>
            <td>BYUI</td>
            <td>September 15, 2026</td>
          </tr>
          <tr>
            <td>Elder James O. Fantone</td>
            <td>The battle is the Lord's</td>
            <td>BYUI</td>
            <td>September 22, 2026</td>
          </tr>
          <form>
            <input type="text" name="speaker" placeholder="Speaker" />
            <input type="text" name="title" placeholder="Title" />
            <input type="text" name="location" placeholder="Location" />
            <input type="text" name="year" placeholder="Year" />
          </form>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
